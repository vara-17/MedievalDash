// Plugin Android de Godot (v2) para iniciar sesión con Google mediante Credential Manager.
// Versiones alineadas con la plantilla de Godot 4.7.2 (android/build/config.gradle).
// Las dependencias de "implementation" también se declaran en
// addons/google_sign_in/google_sign_in.gd para que entren en el APK.

plugins {
    id 'com.android.library' version '8.6.1'
    id 'org.jetbrains.kotlin.android' version '2.1.21'
}

android {
    namespace 'com.vara17.googlesignin'
    compileSdk 36

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    compileOnly 'org.godotengine:godot:4.7.2.stable'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
